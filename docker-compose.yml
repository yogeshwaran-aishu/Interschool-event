# Local stack per the backend PRD: API, worker, PostgreSQL and Mailpit (catches email at :8025).
# Without Docker, use `npm run db` (embedded PostgreSQL) and `npm run api` instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: isc
      POSTGRES_PASSWORD: isc
      POSTGRES_DB: interschool
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U isc -d interschool']
      interval: 2s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['8025:8025', '1025:1025']

  migrate:
    build: ./server
    command: ['node', 'dist/db/migrate.js']
    environment: &env
      NODE_ENV: development
      DATABASE_URL: postgres://isc:isc@postgres:5432/interschool
      JWT_SECRET: local-docker-secret-change-me-0000000000
      CORS_ORIGINS: http://localhost:4200
      APP_URL: http://localhost:4200
      INITIAL_PASSWORD: demo1234
      ALLOW_DEMO_RESET: 'true'
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./server
    command: ['sh', '-c', 'node dist/db/seed.js --if-empty; node dist/server.js']
    environment: *env
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: ./server
    command: ['node', 'dist/worker.js']
    environment: *env
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
